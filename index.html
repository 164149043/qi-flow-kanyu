<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="favicon.ico" sizes="16x32x48" />
  <title>炁流 · 星空门户</title>
  <style>
    /* critical：防白闪，完整样式异步到货 */
    html{background:#000}
  </style>
  <!-- CSS 异步加载（media=print 不阻塞渲染，到货后切 all），与 kanyu.html 同款手法 -->
  <link rel="stylesheet" href="/src/home/home.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="/src/home/home.css"></noscript>
</head>
<body>
  <!--
  THESIS: 门户不做卡片墙导航站，做一片可栖的星系——星流 Starflow 引擎（three.js + bloom +
  镜头光晕，Astra 发布页同源）撑起 4000 星螺旋星系：自转、拖拽旋转、划过推开星尘。
  星系居中是唯一主角，品牌与文案退到页脚，入口卡沉底，内容层 pointer-events:none 让位画布。
  OWN-WORLD: 纯黑底 + 调色板 astra（霁青 #6DCBF4 + 赭橙 #F87915 的夜空版）+ 楷体大字。
  夜幕进门，入室见素绢——与两内页（炁流 3D / 堪舆）互为反相、同血统。
  STORY: 访客落地，星系自转入场（5.5s intro），拖一下星系跟手旋转，划过星尘让路；
  底部两张亮卡把人送进炁流 3D 与堪舆，四张暗铭牌预留后续术数页。
  FALLBACK: WebGL 不可用 → 引擎 renderStaticFallback 静态星图；reduced-motion → 引擎停帧保构图。
  -->
  <div class="stage"><canvas id="astra" aria-hidden="true"></canvas></div>
  <main class="portal">
    <nav class="topbar">
      <div class="pager">
        <a href="index.html" class="active" title="星空门户（当前页）">主页</a>
        <a href="qiliu.html" title="3D 炁流场模拟">炁流 3D</a>
        <a href="kanyu.html" title="堪舆盘：八宅 / 玄空 / 廿四山 / 年飞星 / 动态九宫 · 户型定盘">堪舆</a>
      </div>
    </nav>
    <!-- 品牌大字与副文案已全部让位：星系是唯一主角，文字退到页脚 -->
    <section class="cards" aria-label="页面入口">
      <a class="card is-live" href="qiliu.html">
        <span class="card-kicker">实时模拟</span>
        <h2>炁流</h2>
        <p>Navier-Stokes 气场 + 八宅吉凶扇区叠加，户型定盘看炁行</p>
        <span class="card-go">入 →</span>
      </a>
      <a class="card is-live" href="kanyu.html">
        <span class="card-kicker">术数排盘</span>
        <h2>堪舆</h2>
        <p>八宅 / 玄空 / 廿四山 / 年飞星 / 动态九宫，黄历干支随身断</p>
        <span class="card-go">入 →</span>
      </a>
      <div class="card is-reserved" aria-disabled="true">
        <h2>八字命理</h2><b>营造中</b>
      </div>
      <div class="card is-reserved" aria-disabled="true">
        <h2>择日吉时</h2><b>营造中</b>
      </div>
      <div class="card is-reserved" aria-disabled="true">
        <h2>玄空排盘</h2><b>营造中</b>
      </div>
      <div class="card is-reserved" aria-disabled="true">
        <h2>罗盘工具</h2><b>营造中</b>
      </div>
    </section>
    <footer class="foot">
      <span class="foot-brand">炁流 QiLiu · 观天之象，察地之炁，四千星尘入洞天</span>
      <small>拖动旋转星系 · 划过推开星尘</small>
    </footer>
  </main>
  <script type="module" src="/src/home/main.js"></script>
</body>
</html>
