<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.ico" sizes="16x32x48" />
  <title>炁流 · 3D风水引擎</title>
  <style>
    /* ===== 点火屏（加载页）：置于内联大 JS 之前，浏览器流式渲染先画出它——白屏期全程陪跑 =====
       零 JS：脚本挂了也正常显示（慢网提示 5s 后自动浮现）；main.js 首帧渲染后淡出移除 */
    #boot{position:fixed;inset:0;background:#f7f4ec;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9999;transition:opacity .5s}
    #boot.hide{opacity:0;pointer-events:none}
    .boot-ring{width:62px;height:62px;border-radius:50%;border:2px solid rgba(43,108,176,.16);border-top-color:#2b6cb0;animation:bootspin 1.5s linear infinite}
    .boot-brand{font-family:KaiTi,STKaiti,serif;font-size:46px;font-weight:700;letter-spacing:16px;text-indent:16px;color:#1c2b3a;animation:bootbreath 2.2s ease-in-out infinite}
    .boot-sub{font-size:13px;color:#8a96aa;letter-spacing:4px}
    .boot-slow{font-size:12px;color:#b0873f;opacity:0;animation:bootslow .6s ease 5s forwards}
    .boot-bar{width:min(220px,60vw);height:3px;border-radius:2px;background:rgba(43,108,176,.13);overflow:hidden;margin-top:6px}
    .boot-bar i{display:block;height:100%;width:0;background:#2b6cb0;border-radius:2px;animation:bootbar 8s ease-out forwards}
    @keyframes bootspin{to{transform:rotate(360deg)}}
    @keyframes bootbreath{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes bootslow{to{opacity:1}}
    @keyframes bootbar{to{width:80%}}
    @media (prefers-reduced-motion: reduce){.boot-ring,.boot-brand{animation:none}.boot-ring{border-top-color:rgba(43,108,176,.5)}}
  </style>
</head>
<body>
  <!--
  THESIS: 炁流主界面从矩形浮层栏堆叠的通用 3D 编辑器骨架，重构为罗盘堪舆操作台。罗盘回归方位仪器本业（承载八宅/九星/大门朝向/环境风向），模式独立成分段控件，工具与源分组归位。拒绝「顶栏 + 属性面板」的品类默认 3D 工具壳。
  OWN-WORLD: 浅灰素绢底 #eceef2 + 霁青一线 #2b6cb0（棱线/激活/罗盘）+ 赭金读数 #c77800 + 赤金选中 #d89000 + 冷蓝灰阴影 rgba(60,70,90) + 毛玻璃浮层 + 五行语义色 + CFD 气动/炁流色带。东方雅致克制，风洞科学骨架。
  STORY: 访客打开，罗盘堪舆图腾先抓住眼球（warm-up 撑场），流体粒子云升起接管焦点；选模式、放源、拖罗盘门向指针调八宅，看吉凶扇区与气流叠加——60 秒理解一种风水-气流关系。
  FIRST VIEWPORT: 全屏浅灰 3D 场景 + 默认户型半透明霁青棱线墙；warm-up 期罗盘图腾居中渐显（24 山环 + 八宅扇区 + 指针）；顶部模式分段（炁流/风场/采光 + 副标）；右侧工具区分组；底部 hint。流体起后罗盘缩为方位锚点。
  FORM: shape-pinned（established-world composition refactor，无 concept-seed roll；shape brief 已确认：罗盘归方位本业 + 模式分段 + 全骨架重组 + warm-up 撑场，DESIGN.md 宪法继承）。
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md.
  -->
  <div id="app"></div>
  <!-- 点火屏：必须在大 JS 之前（流式渲染先到先画）；main.js loop 首帧后淡出移除 -->
  <div id="boot" role="status" aria-label="加载中">
    <div class="boot-ring"></div>
    <div class="boot-brand">炁 流</div>
    <div class="boot-sub">3D 风水引擎 · 点火中</div>
    <div class="boot-slow">首次加载约 1MB，网络较慢请稍候…</div>
    <div class="boot-bar"><i></i></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
